# PostgreSQL con la extensión pgvector para el Centro de Ayuda.
# Levantar con:  docker compose up -d

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: helpcenter
      POSTGRES_PASSWORD: helpcenter
      POSTGRES_DB: helpcenter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpcenter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
